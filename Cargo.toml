[workspace]
resolver = "2"
members = [
    "crates/winmosh",
    "crates/winmosh-bootstrap",
    "crates/winmosh-config",
    "crates/winmosh-platform",
    "crates/winmosh-protocol",
    "crates/winmosh-terminal",
]

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/BG2MKJ/WinMosh"
homepage = "https://github.com/BG2MKJ/WinMosh"
readme = "README.md"
description = "Native Windows Mosh-compatible client written in Rust"
authors = ["BG2MKJ"]
rust-version = "1.80"

[workspace.lints.rust]
unused_extern_crates = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
